<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>MiniProject</title>
  <link rel="stylesheet" href="./style.css">

</head>
<body>
<!-- partial:index.partial.html -->
<section>
  <div class="form-box">
    <div class="form-value">
      <form id="loginForm" action="">
        <h2>Login</h2>
        <div class="inputbox">
          <ion-icon name="person-outline"></ion-icon>
          <input type="text" id="username" required>
          <label for="">Username</label>
        </div>
        <div class="inputbox">
          <ion-icon name="lock-closed-outline"></ion-icon>
          <input type="password" id="password" required>
          <label for="">Password</label>
        </div>

        <div class="inputbox captcha-row">
          <div id="captchaCode" class="captcha-code">----</div>
          <div class="input-field">
            <input type="text" id="captchaInput" required>
            <label for="">Captcha</label>
          </div>
          <ion-icon name="refresh-outline" id="refreshCaptcha" title="Get new code"></ion-icon>
        </div>

        <button type="submit">Log in</button>
        <button type="button" class="exit-btn" onclick="exitSystem()">Exit System</button>
      </form>
    </div>
  </div>
</section>

<!-- Status Modal -->
<div class="modal-overlay" id="modalOverlay">
  <!-- Content will be injected via JS -->
</div>

<!-- partial -->
  <script src="script.js"></script>
  <script src='https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js'></script>
<script src='https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js'></script>
</body>
</html>
